{% extends "base.html" %}
{% block title %}Eliminar cita — ConsultaMed{% endblock %}
{% block content %}
<h1 class="h5 mb-3"><i class="bi bi-exclamation-triangle text-warning"></i> Eliminar cita #{{ object.pk }}</h1>
<p class="text-muted">{{ object }}</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger" onclick="return confirm('¿Confirma eliminar esta cita de forma permanente?');">Eliminar</button>
  <a class="btn btn-outline-secondary" href="{% url 'consultas:cita_list' %}">Cancelar</a>
</form>
{% endblock %}
