{% extends "base.html" %}
{% block title %}Eliminar especialidad{% endblock %}
{% block content %}
<h1 class="h5">¿Eliminar «{{ object.nombre }}»?</h1>
<form method="post">{% csrf_token %}
  <button class="btn btn-danger" type="submit" onclick="return confirm('¿Confirma eliminar?');">Eliminar</button>
  <a class="btn btn-outline-secondary" href="{% url 'consultas:especialidad_list' %}">Cancelar</a>
</form>
{% endblock %}
