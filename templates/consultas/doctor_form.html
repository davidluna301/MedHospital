{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Médico — ConsultaMed{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Médico</h1>
<div class="card card-cm p-4">
  <p class="small text-muted">El usuario debe existir con rol «Médico» (cree usuarios desde el admin si es necesario).</p>
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button class="btn btn-cm-primary" type="submit">Guardar</button>
    <a class="btn btn-link" href="{% url 'consultas:doctor_list' %}">Volver</a>
  </form>
</div>
{% endblock %}
