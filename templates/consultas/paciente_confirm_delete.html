{% extends "base.html" %}
{% block title %}Eliminar paciente{% endblock %}
{% block content %}
<h1 class="h5">¿Eliminar a {{ object }}?</h1>
<form method="post">{% csrf_token %}
  <button class="btn btn-danger" type="submit" onclick="return confirm('¿Confirma eliminar este paciente y su usuario?');">Eliminar</button>
  <a class="btn btn-outline-secondary" href="{% url 'consultas:paciente_list' %}">Cancelar</a>
</form>
{% endblock %}
