# Ejemplo Render.com — alinear rama de despliegue con `develop` del repositorio GitHub.
# https://github.com/davidluna301/MedHospital
services:
  - type: web
    name: consultamed
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn hospital_gestion.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: consultamed-db
          property: connectionString

databases:
  - name: consultamed-db
    databaseName: consultamed
    user: consultamed
